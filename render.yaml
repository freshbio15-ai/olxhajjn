services:
  - type: worker
    name: olx-tracker-bot
    runtime: python
    repo: https://github.com/freshbio15-ai/olxhajjn
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false          # вставиш вручну в дашборді Render
      - key: DATABASE_URL
        fromDatabase:
          name: olx-tracker-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: CHECK_INTERVAL_HOURS
        value: "2"
      - key: DELAY_BETWEEN_ITEMS_SEC
        value: "15"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: olx-tracker-db
    databaseName: olx_tracker
    user: olx_user
    plan: free
